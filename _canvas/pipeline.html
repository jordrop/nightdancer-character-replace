/* ---------------------------------------------------------------- 复制内容解析 */
function assetPromptText(kind, item) {
  if (kind === 'char') {
    return [
      '角色：' + str(item.name),
      'ID：' + str(item.id),
      '历史人物：' + (item.historical ? '是（画面只出现背影 / 侧 3/4，不出现正脸）' : '否'),
      '身份锚点：' + str(item.identity),
      '形象设定：' + str(item.look),
      '只控制：' + str(item.controls),
      '不控制：' + str(item.notControls)
    ].filter((x) => x && x.indexOf('：') !== x.length - 1).join('\n');
  }
  const label = kind === 'scene' ? '场景' : '道具';
  return [
    label + '：' + str(item.name),
    'ID：' + str(item.id),
    '只控制：' + str(item.controls),
    '不控制：' + str(item.notControls)
  ].join('\n');
}
function imagePromptText(shotId) {
  const im = imageByShot(shotId);
  if (!im) return '';
  return str(im.prompt) + (im.negative ? '\n\n负面约束：' + im.negative : '');
}
function unitPromptText(uid) {
  const u = units().filter((x) => String(x.id) === String(uid))[0];
  if (!u) return '';
  return [
    '【' + str(u.id) + '】' + str(u.title),
    '时长：' + fmtDur(u.dur),
    '覆盖镜头：' + arr(u.covers).join('、'),
    '',
    str(u.prompt),
    '',
    '环境运动：' + str(u.env),
    '运镜：' + str(u.camera),
    '口型 / 对白：' + str(u.lip),
    '物理一致性：' + str(u.physics),
    '声音：' + str(u.sound),
    u.firstFrame ? '首帧：' + str(u.firstFrame) : '',
    u.lastFrame ? '末帧：' + str(u.lastFrame) : ''
  ].filter(Boolean).join('\n');
}
function taskPromptText(tid) {
  const t = arr(S.tasks).filter((x) => String(x.id) === String(tid))[0];
  return t ? str(t.prompt) : '';
}
async function doCopy(key) {
  if (!key) return;
  const parts = String(key).split(':');
  const kind = parts[0];
  const id = parts.slice(1).join(':');
  let text = '';
  let label = '已复制';
  const ad = stepData('assets') || {};
  if (kind === 'char') {
    const c = arr(ad.characters).filter((x) => String(x.id || x.name) === id)[0];
    if (c) { text = assetPromptText('char', c); label = '已复制角色提示词'; }
  } else if (kind === 'scene') {
    const s = arr(ad.scenes).filter((x) => String(x.id || x.name) === id)[0];
    if (s) { text = assetPromptText('scene', s); label = '已复制场景提示词'; }
  } else if (kind === 'prop') {
    const p = arr(ad.props).filter((x) => String(x.id || x.name) === id)[0];
    if (p) { text = assetPromptText('prop', p); label = '已复制道具提示词'; }
  } else if (kind === 'kf') {
    const s = shotById(id);
    if (s) { text = str(s.kfPrompt); label = '已复制关键帧提示词'; }
  } else if (kind === 'img') {
    text = imagePromptText(id);
    label = '已复制图片提示词';
  } else if (kind === 'unit') {
    text = unitPromptText(id);
    label = '已复制视频提示词';
  } else if (kind === 'task') {
    text = taskPromptText(id);
    label = '已复制任务提示词';
  } else if (kind === 'md') {
    text = str(stepInfo(S.tab).md);
    label = '已复制当前文稿';
  }
  if (!text || !String(text).trim()) { toast('没有可复制的内容', 'err'); return; }
  copyText(text, label);
}

/* ---------------------------------------------------------------- 页签 / 原文切换 */
function setTab(tab) {
  if (!tab) return;
  if (tab !== 'tasks' && !steps().some((s) => s.key === tab)) return;
  S.menuOpen = false;
  S.modelOpen = false;
  if (S.tab === tab) {
    if (S.raw) { S.raw = false; renderContent(); }
    return;
  }
  S.tab = tab;
  S.raw = false;
  if (tab === 'storyboard') ensureShotVisible();
  renderRail();
  renderContent();
  renderTop();
  const main = $('#main');
  if (main) main.scrollTop = 0;
}
function setRaw(on) {
  S.raw = !!on;
  renderContent();
  if (S.raw) {
    const box = $('#mdBox');
    if (box) { try { box.focus(); box.setSelectionRange(box.value.length, box.value.length); } catch (e) { /* ignore */ } }
  }
}

/* ---------------------------------------------------------------- 新建项目弹窗 */
function fillFormOptions() {
  const m = S.meta || {};
  const ratioEl = $('#fRatio');
  if (ratioEl) {
    const ratios = arr(m.ratios).length ? m.ratios : RATIOS;
    ratioEl.innerHTML = ratios.map((r) => '<option>' + esc(r) + '</option>').join('');
  }
  const modelEl = $('#fModel');
  if (modelEl) {
    const list = metaModels();
    modelEl.innerHTML = list.length
      ? list.map((x) => '<option>' + esc(x) + '</option>').join('')
      : '<option value="">—</option>';
  }
}
function applyFormDefaults() {
  fillFormOptions();
  const m = S.meta || {};
  const dirEl = $('#fDir');
  if (dirEl) { dirEl.value = ''; dirEl.placeholder = m.defaultDir ? ('默认：' + m.defaultDir) : '默认输出目录'; }
  const ep = $('#fEpisode'); if (ep) ep.value = '';
  const ts = $('#fTargetSec'); if (ts) ts.value = '330';
  const style = $('#fStyle'); if (style) style.value = '真人实拍写实历史片';
  const name = $('#fName'); if (name) name.value = '';
  const src = $('#fSource'); if (src) src.value = '';
  const ratioEl = $('#fRatio');
  if (ratioEl && ratioEl.options.length) ratioEl.selectedIndex = 0;
  const modelEl = $('#fModel');
  if (modelEl) {
    const want = curModel();
    if (want && !Array.prototype.some.call(modelEl.options, (o) => o.value === want)) {
      const op = document.createElement('option');
      op.value = want; op.textContent = want;
      modelEl.appendChild(op);
    }
    if (want) modelEl.value = want;
  }
}
function openCreateModal() {
  S.menuOpen = false;
  S.modelOpen = false;
  renderProjHead();
  renderModelPop();
  applyFormDefaults();
  const ov = $('#createOverlay');
  if (!ov) return;
  ov.hidden = false;
  S.modal = 'create';
  setTimeout(() => { const el = $('#fName'); if (el) { try { el.focus(); } catch (e) { /* ignore */ } } }, 30);
}
function closeCreateModal() {
  const ov = $('#createOverlay');
  if (ov) ov.hidden = true;
  if (S.modal === 'create') S.modal = null;
}
async function onCreateSubmit(ev) {
  ev.preventDefault();
  if (S.creating) return;
  const source = $('#fSource') ? $('#fSource').value : '';
  if (!String(source || '').trim()) {
    toast('请先粘贴小说原文 / 故事梗概', 'err');
    const el = $('#fSource'); if (el) { try { el.focus(); } catch (e) { /* ignore */ } }
    return;
  }
  const rawTarget = numOr($('#fTargetSec') && $('#fTargetSec').value, 330);
  const rawDir = String(($('#fDir') && $('#fDir').value) || '').trim().replace(/^[/\\]+/, '').replace(/\\/g, '/');
  const body = {
    name: String(($('#fName') && $('#fName').value) || '').trim() || '未命名项目',
    source: source,
    dir: rawDir,
    episode: String(($('#fEpisode') && $('#fEpisode').value) || '').trim() || 'EP001',
    ratio: ($('#fRatio') && $('#fRatio').value) || ((S.meta && arr(S.meta.ratios)[0]) || '9:16'),
    style: String(($('#fStyle') && $('#fStyle').value) || '').trim() || '真人实拍写实历史片',
    targetSec: Math.min(1800, Math.max(30, rawTarget)),
    model: ($('#fModel') && $('#fModel').value) || curModel() || ((S.meta && S.meta.model) || '')
  };
  const btn = $('#createBtn');
  const old = btn ? btn.textContent : '';
  S.creating = true;
  if (btn) { btn.disabled = true; btn.textContent = '创建中…'; }
  try {
    const r = await api('/api/pipeline/create', { method: 'POST', timeoutMs: 60000, body: JSON.stringify(body) });
    closeCreateModal();
    toast('项目已创建', 'ok');
    await refreshList();
    const newId = (r && r.id) || (S.list[0] && S.list[0].id);
    if (newId) await selectProject(newId, { force: true });
    else { renderSidebar(); renderMain(); }
  } catch (e) {
    toast('创建失败：' + e.message, 'err');
  } finally {
    S.creating = false;
    if (btn) { btn.disabled = false; btn.textContent = old || '创建项目'; }
  }
}

/* ---------------------------------------------------------------- 小输入弹窗（改名 / 确认） */
function askFieldEl() { return $('#askForm .field'); }
function askText(opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    S.askResolve = resolve;
    S.askConfirm = false;
    const ov = $('#askOverlay');
    if (!ov) { resolve(null); return; }
    const t = $('#askTitle'); if (t) t.textContent = opts.title || '重命名项目';
    const s = $('#askSub'); if (s) s.textContent = opts.sub || '';
    const lb = $('#askLabel'); if (lb) lb.textContent = opts.label || '新的名称';
    const ok = $('#askOkBtn'); if (ok) ok.textContent = opts.okText || '保存';
    const field = askFieldEl(); if (field) field.style.display = '';
    const input = $('#askInput');
    if (input) {
      input.value = opts.value == null ? '' : String(opts.value);
      input.placeholder = opts.placeholder || '';
    }
    ov.hidden = false;
    S.modal = 'ask';
    setTimeout(() => {
      if (!input) return;
      try { input.focus(); input.select(); } catch (e) { /* ignore */ }
    }, 30);
  });
}
/** 纯确认弹窗（复用同一个遮罩，隐藏输入框）：确定 → true，取消/关闭 → false */
function askConfirm(opts) {
  opts = opts || {};
  return new Promise((resolve) => {
    S.askResolve = resolve;
    S.askConfirm = true;
    const ov = $('#askOverlay');
    if (!ov) { resolve(false); return; }
    const t = $('#askTitle'); if (t) t.textContent = opts.title || '确认';
    const s = $('#askSub'); if (s) s.textContent = opts.sub || '';
    const ok = $('#askOkBtn'); if (ok) ok.textContent = opts.okText || '确认';
    const field = askFieldEl(); if (field) field.style.display = 'none';
    const input = $('#askInput'); if (input) { input.value = ''; input.placeholder = ''; }
    ov.hidden = false;
    S.modal = 'ask';
    setTimeout(() => { try { if (ok) ok.focus(); } catch (e) { /* ignore */ } }, 30);
  });
}
function closeAsk(value) {
  const ov = $('#askOverlay');
  if (ov) ov.hidden = true;
  if (S.modal === 'ask') S.modal = null;
  const isConfirm = !!S.askConfirm;
  S.askConfirm = false;
  const field = askFieldEl(); if (field) field.style.display = '';
  const r = S.askResolve;
  S.askResolve = null;
  if (!r) return;
  r(isConfirm ? (value !== null) : (value == null ? null : value));
}

/* ---------------------------------------------------------------- 项目操作 */
async function renameProject() {
  if (!S.cur) return;
  const cur = curName();
  const next = await askText({
    title: '重命名项目', sub: '只修改流水线记录里的项目名，不动磁盘目录',
    label: '新的项目名', value: cur, okText: '保存'
  });
  if (next === null) return;
  const name = String(next).trim();
  if (!name) { toast('项目名不能为空', 'err'); return; }
  if (name === cur) return;
  try {
    await api('/api/pipeline/update', { method: 'POST', body: JSON.stringify({ id: S.cur.id, name: name }) });
    S.cur.name = name;
    if (S.state) S.state.name = name;
    const it = S.list.filter((x) => x.id === S.cur.id)[0];
    if (it) it.name = name;
    renderTop(); renderSidebar(); renderProjHead();
    toast('已改名：' + name, 'ok');
  } catch (e) {
    toast('改名失败：' + e.message, 'err');
  }
}
async function exportAll() {
  if (!S.cur || S.busyExport) return;
  S.busyExport = true;
  try {
    const r = await api('/api/pipeline/export', { method: 'POST', body: JSON.stringify({ id: S.cur.id }) });

    } else {
      toast('导出完成', 'ok');
    }
  } catch (e) {
    toast('导出失败：' + e.message, 'err');
  } finally {
    S.busyExport = false;
  }
}

  const nm = curName();

/* ---------------------------------------------------------------- 数据加载 */
function applyState(st) {
  st = st || {};
  const prev = S.state || {};
  const prevSteps = prev.steps || {};
  const nextSteps = {};
  Object.keys(prevSteps).forEach((k) => { nextSteps[k] = prevSteps[k]; });
  Object.keys(st.steps || {}).forEach((k) => {
    nextSteps[k] = Object.assign({}, prevSteps[k] || {}, st.steps[k] || {});
  });
  S.state = Object.assign({}, prev, st, { steps: nextSteps });
  const input = st.input || {};
  const cur = S.cur || { id: st.id };
  if (st.id) cur.id = st.id;
  if (st.name != null) cur.name = st.name;
  if (input.dir != null) cur.dir = input.dir;
  if (input.episode != null) cur.episode = input.episode;
  if (input.ratio != null) cur.ratio = input.ratio;
  if (input.style != null) cur.style = input.style;
  if (input.targetSec != null) cur.targetSec = input.targetSec;
  if (input.model != null) cur.model = input.model;
  cur.stepStatus = cur.stepStatus || {};
  steps().forEach((s) => {
    const x = nextSteps[s.key];
    if (x && x.status) cur.stepStatus[s.key] = x.status;
  });
  S.cur = cur;
  if (!S.dreamina && S.meta && S.meta.dreamina) S.dreamina = S.meta.dreamina;
}
function applyTasks(tasks, dreamina) {
  S.tasks = arr(tasks);
  S.taskErr = '';
  if (dreamina && typeof dreamina === 'object') S.dreamina = dreamina;
  else if (!S.dreamina) S.dreamina = (S.meta && S.meta.dreamina) || { available: false };
  if (S.cur) S.cur.tasks = countTasks(S.tasks);
  renderTop();
  renderSidebar();
  renderRail();
  if (S.tab === 'tasks' || S.tab === 'storyboard') renderContent();
}
async function selectProject(id, opts) {
  opts = opts || {};
  if (!id) return;
  if (!opts.force && S.cur && S.cur.id === id && S.state) return;
  const seq = ++S.loadSeq;
  clearInterval(S.runWatchT);
  S.runWatchT = null;
  const item = S.list.filter((x) => x.id === id)[0];
  S.cur = item ? Object.assign({}, item) : { id: id };
  S.cur.stepStatus = S.cur.stepStatus || {};
  S.state = null;
  S.tasks = [];
  S.taskErr = '';
  S.err = '';
  S.tab = 'script';
  S.raw = false;
  S.shotId = null;
  S.menuOpen = false;
  closePick();
  try { history.replaceState(null, '', '?id=' + encodeURIComponent(id) + deepLinkQuery()); } catch (e) { /* ignore */ }
  renderTop();
  renderSidebar();
  renderMain();
  try {
    const results = await Promise.all([
      api('/api/pipeline/state?id=' + encodeURIComponent(id)),
      api('/api/pipeline/tasks?id=' + encodeURIComponent(id)).catch((e) => ({ __err: e.message }))
    ]);
    if (seq !== S.loadSeq) return;
    const sr = results[0] || {};
    const tr = results[1] || {};
    applyState(sr.state || {});
    if (S.cur && S.cur.id !== id) S.cur.id = id;
    if (!tr.__err) {
      applyTasks(tr.tasks || [], tr.dreamina);
    } else {
      const msg = tr.__err || '任务台账加载失败';
      const fallback = (sr.state && Array.isArray(sr.state.tasks)) ? sr.state.tasks : [];
      if (fallback.length) { applyTasks(fallback, null); S.taskErr = msg; } else { S.taskErr = msg; }
    }
    S.tab = pickDefaultStep();
    const dl = deepLink();
    if (dl.tab && !S.__dlUsed) S.tab = dl.tab;
    if (dl.shot && !S.__dlUsed) S.shotId = dl.shot;
    S.__dlUsed = true;
    S.raw = false;
    renderMain();
    renderTop();
    renderSidebar();
    refreshList().catch(() => { /* 静默刷新列表计数 */ });
  } catch (e) {
    if (seq !== S.loadSeq) return;
    const alt = S.list.filter((x) => x.id !== id)[0];
    if (!opts.fallbackDone && alt) {
      toast('项目读取失败：' + e.message, 'err');
      S.cur = null;
      S.state = null;
      renderSidebar();
      renderMain();
      await selectProject(alt.id, { fallbackDone: true });
      return;
    }
    S.err = e.message || '读取项目失败';
    S.state = null;
    S.tasks = [];
    try { history.replaceState(null, '', location.pathname); } catch (e2) { /* ignore */ }
    renderTop();
    renderSidebar();
    renderMain();
    toast('项目读取失败：' + e.message, 'err');
  }
}
async function refreshList() {
  try {
    const r = await api('/api/pipeline/list');
    S.list = arr(r.items);
    if (S.cur) {
      const found = S.list.filter((x) => x.id === S.cur.id)[0];
      if (found) S.cur = Object.assign(S.cur, found);
    }
    renderSidebar();
    renderTop();
  } catch (e) {
    toast('刷新项目列表失败：' + e.message, 'err');
  }
}
async function refreshCurrent(showToast) {
  if (!S.cur) return;
  const id = S.cur.id;
  const seq = ++S.loadSeq;
  try {
    const results = await Promise.all([
      api('/api/pipeline/state?id=' + encodeURIComponent(id)),
      api('/api/pipeline/tasks?id=' + encodeURIComponent(id)).catch((e) => ({ __err: e.message }))
    ]);
    if (seq !== S.loadSeq || !S.cur || S.cur.id !== id) return;
    const sr = results[0] || {};
    const tr = results[1] || {};
    applyState(sr.state || {});
    if (!tr.__err) {
      applyTasks(tr.tasks || [], tr.dreamina);
    } else {
      const msg = tr.__err || '任务台账加载失败';
      const fallback = (sr.state && Array.isArray(sr.state.tasks)) ? sr.state.tasks : [];
      if (fallback.length) { applyTasks(fallback, null); S.taskErr = msg; } else { S.taskErr = msg; }
    }
    S.err = '';
    renderMain();
    renderTop();
    renderSidebar();
    if (showToast) toast('已刷新', 'ok');
  } catch (e) {
    if (seq === S.loadSeq && showToast) toast('刷新失败：' + e.message, 'err');
  }
}
async function refreshTasks(showToast) {
  if (!S.cur) return;
  const id = S.cur.id;
  try {
    const r = await api('/api/pipeline/tasks?id=' + encodeURIComponent(id));
    if (!S.cur || S.cur.id !== id) return;
    applyTasks(r.tasks || [], r.dreamina);
    if (showToast) toast('任务台账已刷新', 'ok');
  } catch (e) {
    if (!S.cur || S.cur.id !== id) return;
    S.taskErr = e.message;
    renderContent();
    if (showToast) toast('刷新失败：' + e.message, 'err');
  }
}
/* 切换视频模型：写回项目 input.videoModel，并把所有待提交/失败视频任务改成新模型 */
async function setVideoModel(vm) {
  if (!S.cur || !vm) return;
  try {
    await api('/api/pipeline/update', { method: 'POST', body: JSON.stringify({ id: S.cur.id, input: { videoModel: vm } }) });
    const r = await api('/api/pipeline/tasks', { method: 'POST', body: JSON.stringify({ id: S.cur.id, action: 'setVideoModel', model: vm }) });
    if (S.state && S.state.input) S.state.input.videoModel = vm;
    if (S.cur) S.cur.videoModel = vm;

/* ---------------------------------------------------------------- 步骤运行 / 保存 / 下载 */
async function runStep(key) {
  if (!S.cur || !S.state || !key || S.tab === 'tasks') return;
  const info = stepInfo(key);
  if (info.status === 'running') { toast('这一步正在生成中，请稍候', 'err'); return; }
  const m = stepMeta(key);
  const missing = (m.needs || []).filter((k) => ['done', 'stale'].indexOf(stepStatus(k)) < 0);
  if (missing.length) { toast('需要先完成：' + missing.map(stepName).join('、'), 'err'); return; }
  if (anyRunning()) { toast('有步骤正在生成中，请等它完成再运行下一步', 'err'); return; }
  // 已有结果时先确认：整步是「全量重新生成」，不是增量修改
  const prevStatus = stepStatus(key);
  if (prevStatus === 'done' || prevStatus === 'stale') {
    const ok = await askConfirm({
      title: '重跑「' + stripNum(m.name) + '」',
      sub: '这一步会整步全量重新生成（不是增量修改），完成后覆盖现在的结果；下游步骤会被标记为待重跑。'
        + '重跑前会自动备份，跑完不满意可以点「恢复上次结果」退回来。',
      okText: '确认重跑',
    });
    if (!ok) return;
  }
  const before = Object.assign({}, S.state.steps[key] || {});
  S.state.steps = S.state.steps || {};
  S.state.steps[key] = Object.assign({}, before, { status: 'running', progress: 0, message: '已提交，等待开始…', error: null });
  if (S.cur.stepStatus) S.cur.stepStatus[key] = 'running';
  renderRail();
  renderSidebar();
  renderContent();
  try {
    await api('/api/pipeline/run', { method: 'POST', body: JSON.stringify({ id: S.cur.id, step: key }) });
    toast('已开始：' + stripNum(m.name) + '（已自动备份当前结果）', 'ok');
    startRunWatch();
    // 拉一次：让「恢复上次结果」按钮和进度尽快出现
    setTimeout(() => { refreshCurrent(false).catch(() => { /* ignore */ }); }, 1200);
    refreshList().catch(() => { /* ignore */ });
  } catch (e) {
    S.state.steps[key] = Object.assign({}, before);
    if (S.cur.stepStatus) S.cur.stepStatus[key] = before.status || 'idle';
    renderRail();
    renderSidebar();
    renderContent();
    toast('启动失败：' + e.message, 'err');
  }
}
/** 把某一步恢复成"重跑前"的备份（同时恢复下游状态）；恢复前当前结果也会自动备份，可再切回 */
async function restoreStepUi(key) {

/* ---------------------------------------------------------------- 勾选重跑（危险操作统一走这里） */
function runOverlayEl() { return $('#runOverlay'); }
function stepHasResult(key) {
  const info = stepInfo(key);
  const d = info.data;
  return !!(d && typeof d === 'object' && Object.keys(d).length) || String(info.md || '').trim().length > 0;
}
function runSelectedKeys() {
  const sel = S.runSel || {};
  return steps().map((s) => s.key).filter((k) => sel[k]);
}
/** 依赖是否满足：前置已完成/待重跑，或前置也勾选了并且排在前面（会先跑完） */
function runDepsReady(key, sel) {
  const order = steps().map((s) => s.key);
  const need = stepMeta(key).needs || [];
  return need.every((n) => {
    if (sel && sel[n] && order.indexOf(n) < order.indexOf(key)) return true;
    const st = stepStatus(n);
    return st === 'done' || st === 'stale';
  });
}
function openRunModal() {
  if (!S.cur || !S.state) return;
  const ov = runOverlayEl();
  if (!ov) { toast('页面缺少重跑弹窗，请刷新页面', 'err'); return; }
  S.runSel = {};
  const cur = S.tab !== 'tasks' ? S.tab : (steps()[0] && steps()[0].key);
  if (cur) S.runSel[cur] = true;
  S.runAck = false;
  const ack = $('#runAck'); if (ack) ack.checked = false;
  if (anyRunning()) toast('有步骤正在生成中，等它完成后再重跑', 'warn');
  ov.hidden = false;
  S.modal = 'run';
  renderRunModal();
}
function closeRunModal() {
  const ov = runOverlayEl(); if (ov) ov.hidden = true;
  if (S.modal === 'run') S.modal = null;
  S.runSel = null;
  S.runAck = false;
}
function renderRunModal() {
  const ov = runOverlayEl();
  if (!ov || ov.hidden) return;
  const box = $('#runList'); if (!box) return;
  const sel = S.runSel || {};
  const order = steps();
  box.innerHTML = order.map((s) => {
    const st = stepStatus(s.key);
    const on = !!sel[s.key];
    const isRunning = st === 'running';
    const deps = runDepsReady(s.key, sel);
    const has = stepHasResult(s.key);
    const stCls = st === 'done' ? 'ok' : (st === 'running' ? 'orange' : (st === 'error' ? 'bad' : (st === 'stale' ? 'orange' : '')));
    const notes = [];
    if (isRunning) notes.push('正在生成中，不能勾选');
    else if (has) notes.push('会覆盖现有结果（重跑前自动备份）');
    else notes.push('还没有结果，将新生成');
    if (!deps) {
      const bad = (stepMeta(s.key).needs || []).filter((n) => {
        const ns = stepStatus(n);
        return !(sel[n] || ns === 'done' || ns === 'stale');
      });
      notes.push('需先完成：' + bad.map(stepName).join('、'));
    }
    return '<label class="run-row' + (on ? ' on' : '') + (isRunning ? ' dis' : '') + '">'
      + '<input type="checkbox" data-run-step="' + esc(s.key) + '"' + (on ? ' checked' : '') + (isRunning ? ' disabled' : '') + '>'
      + '<span class="rr-main"><span class="rr-t"><b class="rr-name">' + esc(stripNum(s.name)) + '</b>'
      + '<span class="pill ' + stCls + '">' + esc(ST_TEXT[st] || st) + '</span>'
      + (has ? '<span class="chip">已有结果</span>' : '<span class="chip">空</span>')
      + (deps ? '' : '<span class="rr-warn">⚠ 依赖不满足</span>')
      + '</span>'
      + '<span class="rr-hint">' + esc(notes.join('；')) + '</span></span></label>';
  }).join('');
  const keys = runSelectedKeys();
  const needAck = keys.some((k) => stepHasResult(k));
  const ackRow = $('#runAckRow');
  if (ackRow) ackRow.hidden = !needAck;
  const blocked = keys.some((k) => !runDepsReady(k, sel));
  const go = $('#runGo');
  if (go) {
    go.disabled = !(keys.length > 0 && !blocked && (!needAck || S.runAck));
    go.innerHTML = keys.length ? ('确认重跑（' + keys.length + ' 步）') : '确认重跑';
  }
  const foot = $('#runFoot');
  if (foot) {
    foot.textContent = keys.length
      ? ('将按顺序执行：' + keys.map((k) => stripNum(stepName(k))).join(' → ') + '（只调用文本模型，不花即梦积分）')
      : '还没有勾选任何步骤';
  }
}
/** 某步的传递下游（分镜/提示词这类），用于「本步 + 下游」快捷勾选 */
function downstreamKeys(key) {
  const out = [];
  const walk = (k) => {
    steps().forEach((s) => {
      if ((s.needs || []).indexOf(k) < 0) return;
      if (out.indexOf(s.key) >= 0) return;
      out.push(s.key);
      walk(s.key);
    });
  };
  walk(key);
  return out;
}
function runQuick(mode) {
  const order = steps().map((s) => s.key);
  const cur = S.tab !== 'tasks' ? S.tab : order[0];
  S.runSel = {};
  if (mode === 'all') order.forEach((k) => { S.runSel[k] = true; });
  else if (mode === 'none') S.runSel = {};
  else if (mode === 'cur' && cur) S.runSel[cur] = true;
  else if (mode === 'curdown' && cur) {
    S.runSel[cur] = true;
    downstreamKeys(cur).forEach((k) => { S.runSel[k] = true; });
  }
  // 依赖不满足的自动去掉，别让人点了才发现不能跑
  const bad = order.filter((k) => S.runSel[k] && !runDepsReady(k, S.runSel));
  if (bad.length) {
    bad.forEach((k) => { delete S.runSel[k]; });
    toast('已跳过依赖不满足的步骤：' + bad.map((k) => stripNum(stepName(k))).join('、'), 'warn');
  }
  renderRunModal();
}
async function submitRunBatch() {
  if (!S.cur || !S.state) return;
  const keys = runSelectedKeys();
  const sel = S.runSel || {};
  if (!keys.length) { toast('请至少勾选一个步骤', 'warn'); return; }
  const blocked = keys.filter((k) => !runDepsReady(k, sel));
  if (blocked.length) { toast('依赖不满足：' + blocked.map((k) => stripNum(stepName(k))).join('、'), 'err'); return; }
  if (keys.some((k) => stepHasResult(k)) && !S.runAck) { toast('请先勾选下面的「我已知晓」', 'warn'); return; }
  if (anyRunning()) { toast('有步骤正在生成中，等它完成再提交', 'err'); return; }
  const go = $('#runGo');
  if (go) { go.disabled = true; go.innerHTML = '<span class="sp"></span>提交中…'; }
  try {
    const r = await api('/api/pipeline/run-batch', {
      method: 'POST',
      body: JSON.stringify({ id: S.cur.id, steps: keys }),
      timeoutMs: 60000,
    });
    closeRunModal();
    const n = (r && r.total) || keys.length;
    toast('已开始勾选重跑 ' + n + ' 步（每步都已自动备份）', 'ok');
    const first = keys[0];
    if (S.state && S.state.steps && S.state.steps[first]) {
      S.state.steps[first] = Object.assign({}, S.state.steps[first], { status: 'running', progress: 0, message: '排队中…', error: null });
    }
    renderRail(); renderSidebar(); renderTop(); renderContent();
    startRunWatch();
    setTimeout(() => { refreshCurrent(false).catch(() => { /* ignore */ }); }, 1200);
    refreshList().catch(() => { /* ignore */ });
  } catch (e) {
    if (go) { go.disabled = false; go.innerHTML = keys.length ? ('确认重跑（' + keys.length + ' 步）') : '确认重跑'; }
    toast('启动失败：' + e.message, 'err');
  }
}
/** 兜底看门狗：SSE 断线或事件丢失时，按间隔轮询状态，直到没有 running 步骤 */
function startRunWatch() {
  clearInterval(S.runWatchT);
  let ticks = 0;
  S.runWatchT = setInterval(() => {
    ticks++;
    if (!S.cur) { clearInterval(S.runWatchT); S.runWatchT = null; return; }
    if (!anyRunning() || ticks > 100) {
      clearInterval(S.runWatchT);
      S.runWatchT = null;
      if (ticks > 100) toast('步骤运行时间过长，已停止自动刷新；可点「刷新数据」查看', 'warn');
      return;
    }
    refreshCurrent(false).catch(() => { /* ignore */ });
  }, 8000);
}
async function saveDraft() {
  if (!S.cur || !S.tab || S.tab === 'tasks') return;

  const box = $('#mdBox');
  const md = box ? box.value : String(stepInfo(key).md || '');

function downloadMd() {
  if (!S.cur || !S.tab || S.tab === 'tasks') return;
  const box = $('#mdBox');
  const md = box ? box.value : String(stepInfo(S.tab).md || '');
  if (!md.trim()) { toast('当前步骤还没有文稿可下载', 'err'); return; }
  const key = S.tab;
  const m = stepMeta(key);
  const base = String(curName()) + '-' + stripNum(m.name);
  const fname = base.replace(/[\\/:*?"<>|\r\n]/g, '_') + '.md';
  try {
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      try { URL.revokeObjectURL(url); } catch (e) { /* ignore */ }
      try { a.remove(); } catch (e) { /* ignore */ }
    }, 400);
    toast('已下载：' + fname, 'ok');
  } catch (e) {
    toast('下载失败：' + e.message, 'err');
  }
}

/** 批量轮询所有"已提交未完成"的任务（SSE 断线/任务长时间挂起时的恢复手段） */

/* ---------------------------------------------------------------- 全局点击分发 */
function runAction(act, el) {
  if (!act) return;
  if (act === 'new') { openCreateModal(); return; }
  if (act === 'create-close') { closeCreateModal(); return; }
  if (act === 'ask-close') { closeAsk(null); return; }
  if (act === 'pick-close') { closePick(); return; }
  if (act === 'pick-manual-ok') { manualPick(); return; }
  if (act === 'pick-reload') { reloadPick(); return; }
  if (act === 'menu') { S.menuOpen = !S.menuOpen; S.modelOpen = false; renderProjHead(); renderModelPop(); return; }
  if (act === 'model-menu') { S.modelOpen = !S.modelOpen; S.menuOpen = false; renderProjHead(); renderModelPop(); return; }
  if (act === 'run') { openRunModal(); return; }
  if (act === 'run-close') { closeRunModal(); return; }
  if (act === 'run-go') { submitRunBatch(); return; }
  if (act === 'run-quick') { runQuick((el && el.getAttribute('data-mode')) || 'cur'); return; }
  if (act === 'restore-step') { restoreStepUi(S.tab); return; }
  if (act === 'save') { saveDraft(); return; }
  if (act === 'download') { downloadMd(); return; }
  if (act === 'copy-md') { doCopy('md'); return; }
  if (act === 'view-visual') { setRaw(false); return; }
  if (act === 'view-raw') { setRaw(true); return; }
  if (act === 'refresh-current') { refreshCurrent(true); return; }
  if (act === 'bind-shot') { bindImage('shot', el && el.getAttribute('data-key') || S.shotId); return; }
  if (act === 'unbind-shot') { unbindImage('shot', el && el.getAttribute('data-key') || S.shotId); return; }
  if (act === 'bind-asset') { bindImage('asset', el && el.getAttribute('data-key')); return; }
  if (act === 'unbind-asset') { unbindImage('asset', el && el.getAttribute('data-key')); return; }
  if (act === 'refresh-tasks') { refreshTasks(true); return; }
  if (act === 'poll-all') { pollAllRunning(); return; }
  if (act === 'download-all') { downloadAllReady(); return; }
  if (act === 'sync-first') { syncFirstFrames(); return; }
  if (act === 'build') { buildTasks(); return; }
  if (act === 'clear-failed') { clearFailed(); return; }
  if (act === 'export') { exportAll(); return; }
  if (act === 'open-dir') { openDir(); return; }
  if (act === 'rename') { S.menuOpen = false; renderProjHead(); renameProject(); return; }
  if (act === 'delete') { S.menuOpen = false; renderProjHead(); deleteProject(); return; }
  if (act === 'copy-project') { S.menuOpen = false; renderProjHead(); copyProjectSummary(); return; }
  if (act === 'reload') { reloadAll(); return; }
  if (act === 'go-tasks') { setTab('tasks'); return; }
  if (act === 'expand-prompt') {
    const card = el.closest('.pcard');
    if (card) {
      card.classList.toggle('open');
      el.textContent = card.classList.contains('open') ? '收起' : '展开全部';
    }
    return;
  }
}
function onClick(e) {
  const t = e.target;
  if (!t || !t.closest) return;
  if (!t.closest('.model-wrap') && S.modelOpen) { S.modelOpen = false; renderModelPop(); }
  if (!t.closest('.ph-actions') && S.menuOpen) { S.menuOpen = false; renderProjHead(); }
  const actEl = t.closest('[data-act]');
  const tabEl = t.closest('[data-tab]');
  const projEl = t.closest('[data-proj]');
  const shotEl = t.closest('[data-shot]');
  const ptabEl = t.closest('[data-ptab]');
  const taskEl = t.closest('[data-taskact]');
  const modelEl = t.closest('[data-model]');
  const copyEl = t.closest('[data-copy]');
  const expEl = t.closest('[data-expand]');
  const pickEl = t.closest('[data-pick]');
  if (actEl) { runAction(actEl.getAttribute('data-act'), actEl); return; }
  if (pickEl) { confirmPick(pickEl.getAttribute('data-pick')); return; }
  if (tabEl) { setTab(tabEl.getAttribute('data-tab')); return; }
  if (projEl) { selectProject(projEl.getAttribute('data-proj')); return; }
  if (shotEl) { S.shotId = shotEl.getAttribute('data-shot'); renderContent(); return; }
  if (ptabEl) { S.promptTab = ptabEl.getAttribute('data-ptab'); renderContent(); return; }
  if (taskEl) {
    if (taskEl.disabled) return;
    taskAction(taskEl.getAttribute('data-taskact'), taskEl.getAttribute('data-tid'));
    return;
  }
  if (modelEl) { selectModel(modelEl.getAttribute('data-model')); return; }
  if (expEl) {
    const card = expEl.closest('.acard');
    if (card) {
      card.classList.toggle('expanded');
      const isChar = expEl.getAttribute('data-kind') === 'char';
      expEl.textContent = card.classList.contains('expanded')
        ? '收起设定'
        : (isChar ? '展开身份 / 形象 / 控制边界' : '展开控制边界');
    }
    return;
  }
  if (copyEl) { doCopy(copyEl.getAttribute('data-copy')); return; }
}
function onKeyDown(e) {
  const k = String(e.key || '');
  if (k === 'Escape') {
    if (S.modal === 'create') { closeCreateModal(); return; }
    if (S.modal === 'ask') { closeAsk(null); return; }
    if (S.modal === 'pick') { closePick(); return; }
    if (S.modal === 'run') { closeRunModal(); return; }
    if (S.menuOpen) { S.menuOpen = false; renderProjHead(); return; }
    if (S.modelOpen) { S.modelOpen = false; renderModelPop(); return; }
    return;
  }
  if (k === 'Enter' && S.modal === 'pick' && e.target) {
    const id = String(e.target.id || '');
    if (id === 'pickSearch') {
      const first = $('#pickGrid .pick-card');
      if (first) { e.preventDefault(); confirmPick(first.getAttribute('data-pick')); return; }
    }
    if (id === 'pickPath') { e.preventDefault(); manualPick(); return; }
  }
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 's') {
    e.preventDefault();
    if (!S.cur) return;
    if (S.raw && S.tab !== 'tasks') saveDraft();
    else toast('可视化模式无需保存；如需编辑原文请切到「原文」', 'warn');
  }
}
function bindStatic() {
  document.addEventListener('click', onClick, false);
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el && el.id === 'mdBox') onMdInput();
    if (el && el.id === 'pickSearch' && S.pick) { S.pick.q = String(el.value || ''); renderPickGrid(); }
  });
  document.addEventListener('keydown', onKeyDown, false);
  document.addEventListener('change', function (e) {
    const el = e.target;
    if (el && el.closest && el.closest('[data-vmodel]')) setVideoModel(el.value);
    if (el && el.id === 'runAck') { S.runAck = !!el.checked; renderRunModal(); }
    if (el && el.getAttribute && el.getAttribute('data-run-step')) {
      const key = el.getAttribute('data-run-step');
      S.runSel = S.runSel || {};
      if (el.checked) S.runSel[key] = true; else delete S.runSel[key];
      renderRunModal();
    }
    if (el && el.id === 'pickManual') {
      const row = $('#pickManualRow');
      if (row) row.hidden = !el.checked;
      if (el.checked) {
        const inp = $('#pickPath');
        if (inp) {
          if (!inp.value && S.pick && S.pick.target && S.pick.target.current) inp.value = S.pick.target.current;
          try { inp.focus(); inp.select(); } catch (err) { /* ignore */ }
        }
      }
    }
  }, false);
  const cf = $('#createForm');
  if (cf) cf.addEventListener('submit', onCreateSubmit);
  const af = $('#askForm');
  if (af) af.addEventListener('submit', (e) => { e.preventDefault(); const input = $('#askInput'); closeAsk(input ? input.value : ''); });
  const ov = $('#createOverlay');
  if (ov) ov.addEventListener('mousedown', (e) => { if (e.target === ov) closeCreateModal(); });
  const av = $('#askOverlay');
  if (av) av.addEventListener('mousedown', (e) => { if (e.target === av) closeAsk(null); });
  const pv = $('#pickOverlay');
  if (pv) pv.addEventListener('mousedown', (e) => { if (e.target === pv) closePick(); });
  const rv = $('#runOverlay');
  if (rv) rv.addEventListener('mousedown', (e) => { if (e.target === rv) closeRunModal(); });
}

/* ---------------------------------------------------------------- SSE 实时通道 */
function onPipelineEvent(d) {
  if (!d || !S.cur) return;
  if (d.id !== S.cur.id) return;
  const key = d.step;
  // 图片索引更新（绑定/解绑/产物落盘）：直接重拉状态
  if (key === 'images') {
    if (d.status === 'done') refreshCurrent(false).catch(() => { /* ignore */ });
    return;
  }
  if (!key) return;
  // 未知步骤（后端以后扩展）：兜底重拉，不要静默丢弃事件
  if (!steps().some((s) => s.key === key)) { refreshCurrent(false).catch(() => { /* ignore */ }); return; }
  const st = d.status;
  if (!S.state) S.state = { steps: {} };
  if (!S.state.steps) S.state.steps = {};
  const prev = S.state.steps[key] || {};
  const merged = Object.assign({}, prev);
  if (st) merged.status = st;
  if (d.progress != null) merged.progress = d.progress;
  if (d.message != null) merged.message = d.message;
  if (d.at != null) merged.at = d.at;
  if (st === 'error') merged.error = d.message || prev.error || '生成失败';
  if (st === 'done') { merged.error = null; mergeStaleDownstream(key); }
  S.state.steps[key] = merged;
  if (S.cur.stepStatus) S.cur.stepStatus[key] = merged.status || prev.status;
  renderRail();
  renderSidebar();
  renderTop();
  if (S.tab === key || S.tab === 'storyboard' || S.tab === 'tasks') {
    if (!isEditingRaw()) renderContent();
    else renderCvToolbar();
  } else {
    renderCvToolbar();
  }
  if (st !== 'done' && st !== 'error') return;
  if (st === 'done') toast('完成：' + stripNum(stepName(key)), 'ok');
  else toast('失败：' + stripNum(stepName(key)) + ' — ' + short(d.message || prev.error || '未知错误', 60), 'err');
  clearTimeout(S.refreshT);
  S.refreshT = setTimeout(() => {
    refreshCurrent(false);
    refreshList().catch(() => { /* ignore */ });
  }, 250);
}
/** 某步重跑完成后，本地同步把下游已完成的步骤标记为待重跑（与后端保持一致，避免看到过期数据却显示"已完成"） */
function mergeStaleDownstream(key) {
  if (!S.state || !S.state.steps) return;
  const walk = (k, depth) => {
    if (depth > 8) return;
    steps().forEach((s) => {
      if ((s.needs || []).indexOf(k) < 0) return;
      const st = S.state.steps[s.key];
      if (st && st.status === 'done') {
        st.status = 'stale';
        st.message = '上游「' + stepName(key) + '」已更新，需重跑本步';
        st.progress = 0;
      }
      walk(s.key, depth + 1);
    });
  };
  walk(key, 0);
}
function connectSSE() {
  if (typeof EventSource === 'undefined') {
    setConn(false);
    toast('浏览器不支持实时通道，页面仍可使用（手动刷新查看进度）', 'err');
    return;
  }
  let es;
  try { es = new EventSource('/api/events'); } catch (e) { setConn(false); return; }
  S.sse = es;
  let wasDown = false;
  es.addEventListener('hello', () => {
    const reconnected = wasDown || S.conn === false;
    wasDown = false;
    setConn(true);
    // 断线重连后补拉一次，避免错过断线期间的事件
    if (reconnected && S.cur) {
      refreshCurrent(false).catch(() => { /* ignore */ });
      refreshList().catch(() => { /* ignore */ });
    }
  });
  es.addEventListener('pipeline', (e) => {
    let d = null;
    try { d = JSON.parse(e.data); } catch (err) { return; }
    onPipelineEvent(d);
  });
  es.onerror = () => {
    wasDown = true;
    setConn(false);
    toast('实时通道断开，正在自动重连…', 'warn');
  };
}

/* ---------------------------------------------------------------- 启动 */
async function boot() {
  bindStatic();
  setConn(null);
  try {
    const m = localStorage.getItem('pipe.model');
    if (m) S.model = m;
  } catch (e) { /* ignore */ }
  renderTop();
  renderSidebar();
  renderMain();
  const results = await Promise.allSettled([
    api('/api/pipeline/meta'),
    api('/api/pipeline/list')
  ]);
  const metaR = results[0];
  const listR = results[1];
  if (metaR.status === 'fulfilled') {
    S.meta = metaR.value || null;
    if (S.meta && S.meta.dreamina) S.dreamina = S.meta.dreamina;
    if (!S.model) S.model = str(S.meta && S.meta.model);
  } else {
    toast('读取页面配置失败：' + reasonMsg(metaR.reason) + '（使用内置默认值）', 'err');
  }
  if (listR.status === 'fulfilled') {
    S.list = arr(listR.value && listR.value.items);
  } else {
    toast('读取项目列表失败：' + reasonMsg(listR.reason), 'err');
  }
  applyFormDefaults();
  renderTop();
  renderSidebar();
  renderMain();
  connectSSE();
  let wanted = null;
  try { wanted = new URLSearchParams(location.search).get('id'); } catch (e) { wanted = null; }
  if (wanted) {
    await selectProject(wanted, { force: true });
  } else if (S.list.length) {
    await selectProject(S.list[0].id);
  } else {
    S.err = '';
    renderMain();
  }
}
boot();

</script>
